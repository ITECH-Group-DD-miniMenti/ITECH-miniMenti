{% extends "base.html" %}
{% block title %}Join a Poll - miniMenti{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <h2 class="fw-bold mb-4">Enter 6-Digit Code</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" name="pin" class="form-control form-control-lg text-center fw-bold shadow-sm" 
                       placeholder="000000" maxlength="6" pattern="[0-9]{6}" required 
                       style="font-size: 3rem; letter-spacing: 0.8rem; border-radius: 15px;">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow">Join Now</button>
        </form>
        <p class="mt-4 text-muted small">The 6-digit code is provided by your host.</p>
    </div>
</div>
{% endblock %}
